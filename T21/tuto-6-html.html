<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
      <h1>Images et figures HTML</h1>
    <p>Une image permet d'afficher un contenu visuel dans une page HTML.</p>
    <img src="images/anas.png" alt="Portrait d'un développeur" width="120" height="120">
    <figure>
        <img src="images/anas.png" alt="Développeur écrivant du code" width="300px" height="auto" >
        <figcaption>Le développeur écrit le code de l'application.</figcaption>
    </figure>
</body>
</html>
